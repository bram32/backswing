name: FreeRelief
options:
  bundleIdPrefix: com.brampek
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    DEVELOPMENT_TEAM: JYMA2YQJV9
    CURRENT_PROJECT_VERSION: 1
    VERSIONING_SYSTEM: "apple-generic"
    MARKETING_VERSION: 1.0.0
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  FreeRelief:
    type: application
    platform: iOS
    sources:
      - path: FreeRelief/Sources
      - path: FreeRelief/Assets.xcassets
      - path: FreeRelief/web
        type: folder
        buildPhase: resources
    info:
      path: FreeRelief/Info.plist
      properties:
        CFBundleDisplayName: Free Relief
        CFBundleName: Free Relief
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIViewControllerBasedStatusBarAppearance: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIRequiresFullScreen: false
    settings:
      base:
        # legacy bundle id: kept so the existing App Store Connect record and
        # TestFlight testers keep working. The App Store Connect API cannot create
        # app records, so changing this needs a new record made on the website.
        PRODUCT_BUNDLE_IDENTIFIER: com.brampek.backswing
        PRODUCT_NAME: FreeRelief
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: false
        ENABLE_USER_SCRIPT_SANDBOXING: false
